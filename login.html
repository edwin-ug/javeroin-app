<!DOCTYPE html>
<html>
<head>
    <title>Javeroin WiFi Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 50%, #0e7490 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .card { 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 35px;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        h2 { 
            color: #1a1a2e;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 35px;
            font-weight: 400;
        }
        
        input[type="text"] { 
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            text-align: center;
            transition: all 0.3s ease;
            background: #f9fafb;
            color: #1a1a2e;
            font-weight: 500;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #06b6d4;
            background: white;
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.1);
        }
        
        input[type="text"]::placeholder {
            color: #9ca3af;
            font-weight: 400;
        }
        
        button { 
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .footer { 
            margin-top: 30px;
            font-size: 13px;
            color: #9ca3af;
            font-weight: 400;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">
        <img src="logo.png" alt="Javeroin Logo" />
    </div>
    <h2>JAVEROIN WIFI</h2>
    <p class="subtitle">Connect to the World</p>

    <form name="login" action="$(link-login-only)" method="post">
        <input type="hidden" name="dst" value="$(link-status)" />
        <input type="hidden" name="popup" value="true" />
        
        <input name="username" type="text" placeholder="ENTER CODE" required autocomplete="off" />
        
        <input name="password" type="hidden" />

        <button type="submit" onclick="copyUser()">Connect</button>
    </form>

    <div class="footer">Powered by Javeroin Systems</div>
</div>

<script>
    // 1. Your original function for manual typing
    function copyUser() {
        var user = document.forms['login'].elements['username'].value;
        document.forms['login'].elements['password'].value = user;
    }

    // 2. NEW: Auto-Login Logic for QR Scans
    window.onload = function() {
        // Check the URL for ?username=XXXX
        var params = new URLSearchParams(window.location.search);
        
        if (params.has('username')) {
            var code = params.get('username');
            
            // Fill the hidden and visible fields
            document.forms['login'].elements['username'].value = code;
            document.forms['login'].elements['password'].value = code;
            
            // Optional: Add a tiny delay so the user sees the code 
            // before it magically logs them in (e.g., 500ms)
            setTimeout(function() {
                document.forms['login'].submit();
            }, 500);
        }
    };
</script>

</body>
</html>
